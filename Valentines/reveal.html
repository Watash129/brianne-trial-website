<!DOCTYPE html>
<html>
<head>
    <title>Wait... 💖</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        p {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 3s forwards;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: white;
            color: #ff4e8a;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>

</head>

<body>

    <h1>Wait... 💕</h1>

    <p>
        Before we go any further,  
        I have one very important question for you...
    </p>

    <button onclick="location.href='valentine.html'">
        Continue 💌
    </button>

</body>
</html>
